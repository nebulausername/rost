<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C130E" />
    <meta name="description" content="Röstbrüder Studio – Social-Media- und Werbeplanung für die Röstbrüder Kaffeerösterei Weimar." />
    <title>Röstbrüder Studio</title>
    <script>
      // Theme vor dem ersten Paint setzen, damit nichts aufblitzt.
      try {
        var t = JSON.parse(localStorage.getItem('rb-studio-v1') || '{}')?.state?.settings?.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
